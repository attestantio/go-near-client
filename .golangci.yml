# golangci-lint configuration file
# Documentation: https://golangci-lint.run/usage/configuration/
# Version: 2 (latest configuration format)

# Configuration version - must be "2" for latest golangci-lint
version: "2"

# Options for analysis running
run:
  # Module download mode for Go modules
  # Options: readonly, vendor, mod, sum
  # readonly: prevents automatic go.mod updates (recommended for CI)
  modules-download-mode: readonly
  
  # Include test files in analysis
  # Default: true, but disabled for faster analysis
  tests: false
  
  # Allow multiple parallel golangci-lint instances running
  # Useful for CI environments with multiple jobs
  allow-parallel-runners: true

# Output configuration
output:
  formats:
    # Send output to stderr for better CI integration
    text:
      path: stderr

# Linter configuration
linters:
  # Enable all available linters by default
  default: all

  # Enable custom linters
  enable:
    - attgo

  # Disable specific linters with explanations
  disable:
    - cyclop          # Disabled: Too strict for complex business logic
    - depguard        # Disabled: Not needed with go.mod dependency management
    - dupl            # Disabled: Can generate false positives for similar but different code
    - err113          # Disabled: Too opinionated about error handling patterns
    - exhaustive      # Disabled: Can be overly strict for enum-like types
    - exhaustruct     # Disabled: Too strict for struct initialization patterns
    - forcetypeassert # Disabled: Sometimes type assertions are necessary and safe
    - funlen          # Disabled: Function length limits can be too restrictive
    - gochecknoglobals # Disabled: Global variables are sometimes necessary (e.g., loggers)
    - gocognit        # Disabled: Cognitive complexity can be subjective
    - goconst         # Disabled: Can be overly aggressive with string constants
    - godox           # Disabled: TODO comments are acceptable in development
    - ireturn         # Disabled: Interface returns can be necessary for abstraction
    - lll             # Disabled: Line length is handled by other formatters
    - maintidx        # Disabled: Maintenance index can be subjective
    - mnd             # Disabled: Magic numbers are sometimes acceptable
    - musttag         # Disabled: Struct tags are not always required
    - perfsprint      # Disabled: Performance optimizations can be premature
    - tagliatelle     # Disabled: Struct tag naming is handled by other rules
    - varnamelen      # Disabled: Variable name length can be too restrictive
    - wrapcheck       # Disabled: Error wrapping patterns can vary
    - wsl             # Disabled: Whitespace rules can conflict with formatters
    - noinlineerr     # Disabled: Inline error wrapping not always applicable

  # Linter-specific settings
  settings:
    # goheader: License header enforcement
    goheader:
      values:
        regexp:
          # Pattern to match copyright years (supports various formats)
          YEARS: (20\d\d - 20\d\d|20\d\d, 20\d\d|20\d\d)
      # Template for license header
      template: |-
        Copyright © {{ YEARS }} Attestant Limited.
        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    
    # gosec: Security linter settings
    gosec:
      excludes:
        - G115  # Exclude: "Use of net.Listen("tcp", ":0")" - false positive for dynamic port allocation
    
    # lll: Line length linter (disabled but configured for reference)
    lll:
      line-length: 132  # Maximum line length (matches gofmt default)
    
    # nlreturn: Newline before return statement
    nlreturn:
      block-size: 3  # Allow up to 3 lines before requiring newline before return
    
    # revive: Go linter with extensive rules
    revive:
      confidence: 0.8    # Minimum confidence level for issues
      severity: error    # Treat issues as errors
      enable-all-rules: true  # Enable all available rules
      rules:
        # Disabled rules with explanations
        - name: add-constant
          disabled: true  # Disabled: Can be overly prescriptive
        - name: cyclomatic
          disabled: true  # Disabled: Cognitive complexity handled by other tools
        - name: cognitive-complexity
          disabled: true  # Disabled: Can be subjective
        - name: confusing-results
          # Enabled: Helps identify confusing function return patterns
        - name: function-length
          disabled: true  # Disabled: Function length handled by other linters
        - name: line-length-limit
          arguments:
            - 132  # Maximum line length
        - name: max-public-structs
          disabled: true  # Disabled: Can be too restrictive for some packages
        - name: package-comments
          disabled: true  # Disabled: Package comments not always necessary
        - name: struct-tag
          arguments:
            - json,allowempty  # Enforce JSON struct tags with allowempty
        - name: unhandled-error
          arguments:
            - fmt.Fprint   # Ignore errors from fmt.Fprint
            - fmt.Fprintf  # Ignore errors from fmt.Fprintf
        - name: unnecessary-stmt
          disabled: true  # Disabled: Can be overly strict
    
    # staticcheck: Advanced Go linter
    staticcheck:
      checks:
        - all      # Enable all staticcheck checks
        - -ST1000  # Disable: "Package comment should be of the form "Package x ..."
    
    # tagliatelle: Struct tag naming conventions
    tagliatelle:
      case:
        rules:
          json: snake  # JSON tags should use snake_case
          yaml: snake  # YAML tags should use snake_case

    # attgo-linter: Attestant organization coding standards
    custom:
      attgo:
        type: "module"
        description: "Attestant organization style linter"
        settings:
          # HIGH PRIORITY
          enable_no_pkg_logger: true
          enable_enum_iota: true
          enable_current_year: true
          # MEDIUM PRIORITY
          enable_capital_comment: true
          enable_func_opts: true
          enable_raw_string: true
          # LOW PRIORITY
          enable_struct_field_order: true
          enable_interface_check: true

  # Exclusions: Files and patterns to exclude from analysis
  exclusions:
    generated: lax  # Lax handling of generated files
    presets:
      - common-false-positives  # Exclude common false positive patterns
      - std-error-handling      # Exclude standard error handling patterns
    paths:
      - .*_ssz\.go$  # Exclude SSZ generated files
      - third_party$  # Exclude third-party code
      - builtin$      # Exclude builtin code
      - examples$     # Exclude example code

    rules:
      # Suppress revive var-naming warning for generic package name in the types and util packages
      - path: types/.*.go
        text: "var-naming: avoid meaningless package names.*"
      - path: util/.*.go
        text: "var-naming: avoid meaningless package names.*"
      # Suppress revive package-directory-mismatch warning for client package
      # The package name "client" is intentionally shorter than the directory name for API clarity
      - path: service\.go
        text: "package-directory-mismatch: package name \"client\" does not match directory name \"go-near-client\".*"
      - path: errors\.go
        text: "package-directory-mismatch: package name \"client\" does not match directory name \"go-near-client\".*"


# Formatters: Code formatting tools
formatters:
  enable:
    - gofmt      # Standard Go formatter
    - gofumpt    # Stricter Go formatter
    - goimports  # Import organization and formatting
  exclusions:
    generated: lax  # Lax handling of generated files
    paths:
      - .*_ssz\.go$  # Exclude SSZ generated files
      - third_party$  # Exclude third-party code
      - builtin$      # Exclude builtin code
      - examples$     # Exclude example code
